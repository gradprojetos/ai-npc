name: ai-npc

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ${POSTGRES_CONTAINER_NAME:-npc_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - npc_network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: ${API_CONTAINER_NAME:-npc_api}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      - API_PORT=${API_PORT:-8000}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "uv run alembic -c db/alembic.ini upgrade head && uv run uvicorn api.main:app --host 0.0.0.0 --port $${API_PORT:-8000} --reload"
    networks:
      - npc_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: npc_cloudflared
    restart: unless-stopped
    command: tunnel --url http://api:${API_PORT:-8000} --metrics 0.0.0.0:4567
    networks:
      - npc_network

networks:
  npc_network:
    driver: bridge

volumes:
  postgres_data: