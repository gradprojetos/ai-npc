[project]
name = "ai-npc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "langgraph",
    "python-dotenv",
    "pydantic",
    "httpx",
    "alembic",
    "sqlalchemy",
    "pgvector",
    "psycopg[binary]",
    "python-telegram-bot[job-queue]",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

